name: Build and publish APK

# Every change to the app is built on GitHub's own servers and published as a
# Release, so the download link always serves the newest APK.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Run the Urdu unit tests
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Sign the APKs
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          mkdir -p dist
          sign() {
            "$BT/zipalign" -f -p 4 "app/build/outputs/apk/release/app-$1-release-unsigned.apk" "/tmp/$2"
            "$BT/apksigner" sign --ks keystore/ci-debug.keystore \
              --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey \
              --out "dist/$2" "/tmp/$2"
          }
          sign arm64-v8a   AaliReader-arm64.apk
          sign armeabi-v7a AaliReader-armv7.apk
          sign universal   AaliReader-universal.apk
          "$BT/apksigner" verify dist/AaliReader-arm64.apk
          ls -la dist

      - name: Publish as a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          TAG="v$VERSION"
          NOTES="Aali's Reader $VERSION, built automatically from commit ${GITHUB_SHA::7}.

          - **AaliReader-arm64.apk**: almost every phone from the last eight years
          - **AaliReader-armv7.apk**: older 32 bit phones
          - **AaliReader-universal.apk**: works everywhere, larger download

          Allow installing from unknown sources when Android asks."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
            gh release edit "$TAG" --notes "$NOTES" --latest
          else
            gh release create "$TAG" dist/*.apk --title "Aali's Reader $VERSION" --notes "$NOTES" --latest
          fi
